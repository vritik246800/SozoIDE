# Weekly pull requests to preview for Cargo, the site's npm packages and the workflows' actions.
# Nothing newer than 7 days is proposed (the same wait the project asks of every dependency),
# and nothing is merged without its owner: the pull request runs the same CI as any other.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: preview
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'update:'

  - package-ecosystem: npm
    directory: /site
    target-branch: preview
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'update:'

  - package-ecosystem: github-actions
    directory: /
    target-branch: preview
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'update:'
