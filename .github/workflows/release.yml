name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # On pull requests the builds wait until the repository is public, where Actions minutes are free.
  pull_request:
    branches: [main]
    paths: ['packaging/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  # Each architecture builds natively on its own runner (CLAUDE.md §8).
  windows:
    name: windows (${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.repository.private
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        run: packaging/build-windows.ps1
      - shell: pwsh
        run: packaging/test-install.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-windows-${{ matrix.arch }}
          path: target/wix/*.msi
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/build-macos.sh
      - run: bash packaging/test-install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-macos
          path: target/package/macos/*.dmg
          if-no-files-found: error

  linux:
    name: linux (${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.repository.private
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/build-linux.sh
      - run: bash packaging/test-install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-linux-${{ matrix.arch }}
          path: target/package/linux/*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        run: |
          grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || {
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml"
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # gh puts these notes before the generated ones.
          NOTES: |
            Download the file for your system and install it. Then open a new terminal and run `sozo .` in any folder. SozoIDE tells you when a newer version is out and can install it for you.

            | System | File | Install |
            | --- | --- | --- |
            | macOS (Apple silicon) | `SozoIDE-macos-arm64.dmg` | Open it, drag SozoIDE to Applications and open the app once: it offers to install the `sozo` command |
            | Windows | `SozoIDE-windows-x86_64.msi` or `SozoIDE-windows-arm64.msi` | Open it and follow the setup. Installs for your user only, without administrator rights, and adds `sozo` to the PATH |
            | Debian, Ubuntu | `SozoIDE-linux-x86_64.deb` or `SozoIDE-linux-arm64.deb` | Open it in your software installer, or `sudo apt install ./SozoIDE-linux-*.deb` |
            | Fedora, openSUSE | `SozoIDE-linux-x86_64.rpm` or `SozoIDE-linux-arm64.rpm` | Open it in your software installer, or `sudo dnf install ./SozoIDE-linux-*.rpm` |
            | Other Linux | `SozoIDE-linux-x86_64.tar.gz` or `SozoIDE-linux-arm64.tar.gz` | Extract `sozo` into a folder on your PATH |

            The installers are not signed yet. On macOS, if the app does not open, go to System Settings, Privacy & Security, and choose Open Anyway. On Windows, if SmartScreen appears, choose More info, then Run anyway. `SHA256SUMS.txt` has the checksum of every file.
        run: |
          sha256sum -- * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --generate-notes --notes "$NOTES" --title "SozoIDE $GITHUB_REF_NAME"
