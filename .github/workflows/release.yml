name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # On pull requests the builds wait until the repository is public, where Actions minutes are free.
  pull_request:
    branches: [main]
    paths: ['packaging/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/release.yml']

# Actions of others are pinned to a commit, with the version beside it; the ones GitHub
# publishes stay on their major version.
permissions:
  contents: read

jobs:
  # Two builds of the static Linux binary from two copies in different folders are the same
  # file (TODO 6.4.11); it does not hold the release back, it says when they differ.
  reproducible:
    name: Reproducible
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: bash packaging/reproducible.sh

  # Each architecture builds natively on its own runner (CLAUDE.md §8).
  windows:
    name: windows (${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.repository.private
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
      - shell: pwsh
        run: packaging/build-windows.ps1
      - shell: pwsh
        run: packaging/test-install.ps1
      # Says which workflow run and commit built each package: `gh attestation verify`.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/wix/*.msi
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-windows-${{ matrix.arch }}
          path: target/wix/*.msi
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
      - run: bash packaging/build-macos.sh
      - run: bash packaging/test-install.sh
      # Says which workflow run and commit built each package: `gh attestation verify`.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/package/macos/*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-macos
          path: target/package/macos/*.dmg
          if-no-files-found: error

  linux:
    name: linux (${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.repository.private
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
      # musl-gcc for the static .tar.gz (TODO 6.4.11).
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: bash packaging/build-linux.sh
      - name: Say the size of the package, and warn when it grew more than 10 %
        run: |
          cat target/package/size-linux.txt >> "$GITHUB_STEP_SUMMARY"
          name="SozoIDE-linux-$(uname -m | sed 's/aarch64/arm64/').tar.gz"
          now=$(wc -c < "target/package/linux/$name")
          before=$(curl -fsSIL --proto =https --max-time 20 "https://github.com/${{ github.repository }}/releases/latest/download/$name" | awk 'tolower($1) == "content-length:" { size = $2 } END { print size + 0 }' | tr -d '\r')
          echo "$name: $now bytes (the last release: $before)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$before" -gt 0 ] && [ "$now" -gt $(( before * 11 / 10 )) ]; then
            echo "::warning::$name grew more than 10 % ($before → $now bytes)"
          fi
      - run: bash packaging/test-install.sh
      # Says which workflow run and commit built each package: `gh attestation verify`.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/package/linux/*.*
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-linux-${{ matrix.arch }}
          path: target/package/linux/*.*
          if-no-files-found: error

  # The same gate as CI, again on what is about to be published: an advisory that came out
  # after the pull request stops the release.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo install --locked cargo-audit
      - run: bash packaging/security-check.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the tag has to be a commit of main.
          fetch-depth: 0
      - name: Check that the tag is the version in Cargo.toml and is on main
        run: bash packaging/check-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # gh puts these notes before the generated ones.
          NOTES: |
            Download the file for your system and install it. Then open a new terminal and run `sozo .` in any folder. SozoIDE tells you when a newer version is out and can install it for you.

            | System | File | Install |
            | --- | --- | --- |
            | macOS (Apple silicon) | `SozoIDE-macos-arm64.dmg` | Open it, drag SozoIDE to Applications and open the app once: it offers to install the `sozo` command |
            | Windows | `SozoIDE-windows-x86_64.msi` or `SozoIDE-windows-arm64.msi` | Open it and follow the setup. Installs for your user only, without administrator rights, and adds `sozo` to the PATH |
            | Debian, Ubuntu | `SozoIDE-linux-x86_64.deb` or `SozoIDE-linux-arm64.deb` | Open it in your software installer, or `sudo apt install ./SozoIDE-linux-*.deb` |
            | Fedora, openSUSE | `SozoIDE-linux-x86_64.rpm` or `SozoIDE-linux-arm64.rpm` | Open it in your software installer, or `sudo dnf install ./SozoIDE-linux-*.rpm` |
            | Other Linux | `SozoIDE-linux-x86_64.tar.gz` or `SozoIDE-linux-arm64.tar.gz` | Extract `sozo` into a folder on your PATH |

            SozoIDE offers the tools that make it better (Git, curl, FFmpeg, tmux) on its first start, and Help > Dependencies installs them any time. `install-tools.sh` and `install-tools.cmd` do the same from a terminal.

            The installers are not signed yet. On macOS, if the app does not open, go to System Settings, Privacy & Security, and choose Open Anyway. On Windows, if SmartScreen appears, choose More info, then Run anyway. `SHA256SUMS.txt` has the checksum of every file.

            On its first start SozoIDE downloads the `SozoIDE-<system>-<arch>.installed.txt` file of this release once (`.updated.txt` after an update), so GitHub's download counter counts the installation or update. Nothing else is sent. Set `SOZO_NO_TELEMETRY=1` to turn it off.
        run: |
          # GitHub counts the downloads of these files: one per new installation or update (F20).
          for target in macos-arm64 windows-x86_64 windows-arm64 linux-x86_64 linux-arm64; do
            echo "Counts one installation of SozoIDE $GITHUB_REF_NAME on $target." > "SozoIDE-$target.installed.txt"
            echo "Counts one update to SozoIDE $GITHUB_REF_NAME on $target." > "SozoIDE-$target.updated.txt"
          done
          # The scripts that install the tools SozoIDE recommends (F38).
          cp ../packaging/install-tools.sh ../packaging/install-tools.cmd .
          # The notes of this version, from the binary itself, for the update notice (TODO 6.1.2).
          mkdir notes
          tar -xzf SozoIDE-linux-x86_64.tar.gz -C notes sozo
          notes/sozo --notes > NOTES.txt
          rm -r notes
          sha256sum -- * > SHA256SUMS.txt
          # The manifests of Scoop, winget, the AUR and Homebrew, from those checksums (TODO 6.4.10).
          bash ../packaging/managers.sh "${GITHUB_REF_NAME#v}" .
          mv managers/winget/* managers/sozoide.json managers/sozoide.rb managers/PKGBUILD .
          rm -r managers
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --generate-notes --notes "$NOTES" --title "SozoIDE $GITHUB_REF_NAME"
