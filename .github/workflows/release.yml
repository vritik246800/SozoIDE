name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # On pull requests the builds wait until the repository is public, where Actions minutes are free.
  pull_request:
    branches: [main]
    paths: ['packaging/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        run: packaging/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-windows
          path: target/wix/*.msi
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-macos
          path: target/package/macos/*.pkg
          if-no-files-found: error

  linux:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-linux
          path: target/package/linux/*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        run: |
          grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || {
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml"
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # gh puts these notes before the generated ones.
          NOTES: |
            Download the file for your system and install it. Then open a new terminal and run `sozo .` in any folder.

            | System | File | Install |
            | --- | --- | --- |
            | macOS (Apple silicon) | `.pkg` | Open it |
            | Windows (x86_64) | `.msi` | Open it. Installs for your user only, without administrator rights |
            | Debian, Ubuntu | `.deb` | `sudo apt install ./sozoide_*.deb` |
            | Fedora, openSUSE | `.rpm` | `sudo dnf install ./sozoide-*.rpm` |
            | Other Linux (x86_64) | `.tar.gz` | Extract `sozo` into a folder on your PATH |

            The installers are not signed yet. On macOS, if the package is blocked, open System Settings, Privacy & Security, and choose Open Anyway. On Windows, if SmartScreen appears, choose More info, then Run anyway. `SHA256SUMS.txt` has the checksum of every file.
        run: |
          sha256sum -- * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --generate-notes --notes "$NOTES" --title "SozoIDE $GITHUB_REF_NAME"
