name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # On pull requests the builds wait until the repository is public, where Actions minutes are free.
  pull_request:
    branches: [main]
    paths: ['packaging/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  # Each architecture builds natively on its own runner (CLAUDE.md §8).
  windows:
    name: windows (${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.repository.private
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        run: packaging/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-windows-${{ matrix.arch }}
          path: target/wix/*.msi
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-macos
          path: target/package/macos/*.dmg
          if-no-files-found: error

  linux:
    name: linux (${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.repository.private
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-linux-${{ matrix.arch }}
          path: target/package/linux/*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        run: |
          grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || {
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml"
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # gh puts these notes before the generated ones.
          NOTES: |
            Download the file for your system and install it. Then open a new terminal and run `sozo .` in any folder.

            | System | File | Install |
            | --- | --- | --- |
            | macOS (Apple silicon) | `.dmg` | Open it and drag SozoIDE to Applications. For the `sozo` command, see below |
            | Windows (x86_64 or ARM64) | `x86_64.msi` or `aarch64.msi` | Open it. Installs for your user only, without administrator rights |
            | Debian, Ubuntu | `amd64.deb` or `arm64.deb` | `sudo apt install ./sozoide_*.deb` |
            | Fedora, openSUSE | `x86_64.rpm` or `aarch64.rpm` | `sudo dnf install ./sozoide-*.rpm` |
            | Other Linux | `x86_64-linux.tar.gz` or `aarch64-linux.tar.gz` | Extract `sozo` into a folder on your PATH |

            On macOS, the app is not signed yet. To open it and to run `sozo` from any terminal, run once:

            ```sh
            xattr -dr com.apple.quarantine /Applications/SozoIDE.app
            sudo mkdir -p /usr/local/bin
            sudo ln -sf /Applications/SozoIDE.app/Contents/MacOS/sozo /usr/local/bin/sozo
            ```

            The Windows installer is not signed yet either: if SmartScreen appears, choose More info, then Run anyway. `SHA256SUMS.txt` has the checksum of every file.
        run: |
          sha256sum -- * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --generate-notes --notes "$NOTES" --title "SozoIDE $GITHUB_REF_NAME"
