name: Native packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        run: packaging/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-windows
          path: target/wix/*.msi
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-macos
          path: target/package/macos/*.pkg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sozoide-linux
          path: target/package/linux/*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        run: |
          grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || {
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml"
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --verify-tag --generate-notes --title "SozoIDE $GITHUB_REF_NAME"
